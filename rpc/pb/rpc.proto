syntax = "proto3";

package aether.rpc.v1;

option go_package = "github.com/ORBTR/aether/rpc/pb";

// ScopeAxis is one opaque, named identity axis a trusted gateway established.
// aether carries name and value without interpreting either; the consuming
// project assigns meaning to name and never has aether derive one axis from
// another. It is how an agnostic wire carries a customer organisation, a
// platform tenant, or any other partition without naming them in the mesh.
message ScopeAxis {
  string name = 1;
  string value = 2;
}

// AuthenticatedPrincipal is the immutable caller authority established by a
// trusted gateway before an RPC enters the mesh. It carries the authenticated
// subject, the opaque identity axes the gateway established (the consuming
// project names them; aether interprets none), and the granted scope strings.
// It is deliberately separate from RPCRequest.context: that map is mutable
// request metadata and cannot establish subject, axis, or scope authority. No
// owner partition travels here — the receiver derives it from a transport-gated
// axis, so a peer cannot forge one by setting a field.
message AuthenticatedPrincipal {
  string subject = 1;
  repeated ScopeAxis axes = 2;
  repeated string scopes = 3;
}

// RPCRequest represents a direct RPC call over the mesh network.
message RPCRequest {
  string id = 1;
  string handler = 2;
  bytes payload = 3;
  map<string, string> context = 4;
  int64 timeout_ns = 5;          // nanoseconds (Duration)
  string session_id = 6;
  string trace_id = 7;
  int32 hops = 8;                // forwarding hop counter, max 6

  // Intelligent routing fields
  string target_node_id = 9;     // ultimate destination node
  repeated string route_list = 10; // ordered remaining hops [next, ..., target]
  string request_nonce = 11;     // unique per parallel probe (dedup key)
  int64 deadline = 12;           // absolute deadline (unix nanos)
  AuthenticatedPrincipal principal = 13;
}

// RPCResponse represents the result of an RPC call.
message RPCResponse {
  string id = 1;
  bool success = 2;
  bytes payload = 3;
  string error = 4;
  int64 latency_ns = 5;         // nanoseconds (Duration)
  map<string, string> metadata = 6;
}
