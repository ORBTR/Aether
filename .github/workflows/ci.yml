# Aether — pre-merge CI
#
# Runs on every push to main and every pull request, BEFORE any release tag
# is cut. The release workflow (release.yml) also runs a WASM build, but only
# on tag push — which is too late: the Go module proxy caches a tag's content
# the moment it is pushed, so a GOOS=js break that only surfaces at release
# time has already shipped (see AER-058/059 / L-211: aether v0.0.111 shipped a
# browser build that could not compile, invisible to every server `go build`).
# The GOOS=js GOARCH=wasm build below is the guard that makes that class of
# regression fail a PR instead of reshipping dark.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: '1.25.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build (server / native)
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: Build (browser / GOOS=js GOARCH=wasm) — guards the browser transport
        run: GOOS=js GOARCH=wasm go build ./...
